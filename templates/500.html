<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 - Falla del Sistema | ISW-Lab</title>
    <!-- Se usan CDNs para garantizar que carguen incluso si el servidor local está fallando -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .error-container { 
            max-width: 600px; 
            text-align: center; 
            padding: 50px 40px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border-top: 6px solid #dc3545; 
        }
        .icon-500 { 
            font-size: 80px; 
            color: #dc3545; 
            margin-bottom: 25px; 
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Ícono de satélite desconectado para la temática astrofísica -->
        <i class="fas fa-satellite-dish icon-500"></i>
        
        <h1 class="display-4 fw-bold text-dark mb-3">Error 500</h1>
        <h4 class="text-secondary mb-4">Anomalía interna del servidor</h4>
        
        <p class="text-muted mb-4">
            El simulador ISW-Lab ha perdido conexión con la base de datos o el motor matemático ha colapsado. No podemos procesar tu solicitud en este momento.
        </p>
        
        <a href="/" class="btn btn-outline-danger px-4 py-2">
            <i class="fas fa-sync-alt me-2"></i> Reintentar conexión
        </a>
    </div>

</body>
</html>
