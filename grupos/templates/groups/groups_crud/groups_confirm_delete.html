{% extends 'base.html' %}
{% block content %}
<section>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Eliminar grupo académico</h3>
                    </div>
                    
                    <div class="card-body">
                        <p class="fs-5">¿Estás seguro de que deseas eliminar el grupo <strong>"{{ object.class_name }}"</strong>?</p>
                        <p class="text-muted">Esta acción no se puede deshacer y los estudiantes perderán su acceso a esta clase.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-end mt-4">
                                <a href="{% url 'group_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                                <button type="submit" class="btn btn-danger">Sí, eliminar definitivamente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
