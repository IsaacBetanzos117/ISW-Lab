<!-- Es el mensaje final de éxito. -->
{% extends 'base.html' %}
{% block title %}Contraseña restablecida{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center mt-5">
    <div class="card shadow-sm border-0 bg-light" style="width: 100%; max-width: 500px;">
        <div class="card-body p-5 text-center">
            <i class="fa-solid fa-check-circle text-success mb-3" style="font-size: 3.5rem;"></i>
            <h2 class="card-title mb-3">¡Recuperación exitosa!</h2>
            <p class="card-text text-muted fs-5 mb-4">
                Tu contraseña ha sido actualizada correctamente en el sistema.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Ir a iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
