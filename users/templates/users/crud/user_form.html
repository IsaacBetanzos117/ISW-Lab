{% extends 'base.html' %}
{% block title %}{{ title }} - ISW-Lab{% endblock %}
{% block content %}
<section>
    <div style="max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h1 style="text-align: center; margin-bottom: 20px; color: var(--primary-color);">
            <i class="fa-solid fa-user-pen"></i> {{ title }}
        </h1>

        <form method="POST" novalidate>
            {% csrf_token %}
            
            <div style="margin-bottom: 25px;">
                {{ form.as_p }}
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">
                <i class="fa-solid fa-floppy-disk"></i> {{ text_button }}
            </button>
        </form>

        <div style="text-align: center;">
            <a href="{% url 'user_list' %}" style="color: var(--text-color); text-decoration: none; font-size: 0.9em; transition: color 0.3s;">
                <i class="fa-solid fa-arrow-left"></i> Cancelar y volver al catálogo
            </a>
        </div>
    </div>
</section>
{% endblock %}
