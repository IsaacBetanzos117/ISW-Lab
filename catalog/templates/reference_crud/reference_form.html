{% extends 'base.html' %}
{% load static %}
{% block title %}{{ action_title }}{% endblock %}
{% block content %}
<section>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 mb-5">
                <div class="card shadow-lg border-secondary" style="background-color: var(--card-surface);">
                    
                    <!-- El action_title dirá "Crear nueva referencia" o "Editar referencia"-->
                    <div class="card-header border-secondary text-center py-3" style="background-color: rgba(0, 0, 0, 0.5) !important;">
                        <h3 class="mb-0 fw-bold" style="color: var(--accent-cyan);">
                            <i class="fas fa-meteor me-2"></i>{{ action_title }}
                        </h3>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        {% if form.errors %}
                            <div class="alert alert-danger border-start border-danger border-4 mb-4" role="alert">
                                <i class="fas fa-exclamation-triangle me-2"></i> Por favor, revisa los campos marcados en rojo.
                            </div>
                        {% endif %}

                        <!-- El 'novalidate' le dice al navegador que permita a la validations.js hacer el trabajo de revisión -->
                        <form method="POST" action="" novalidate>
                            {% csrf_token %}
                            {{ form.as_p }}
                            
                            <div class="mt-5 d-grid gap-3 d-sm-flex justify-content-sm-between">
                                <a href="{% url 'reference_list' %}" class="btn btn-outline-secondary px-4 fw-bold">
                                    <i class="fas fa-arrow-left me-1"></i> Cancelar
                                </a>
                                <!-- El button_text dirá "Guardar ficha" o "Actualizar ficha" -->
                                <button type="submit" class="btn btn-primary px-4 fw-bold" style="background-color: var(--accent-cyan); color: #000; border: none;">
                                    <i class="fas fa-save me-1"></i> {{ button_text }}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
